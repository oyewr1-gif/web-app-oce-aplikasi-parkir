<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 50" width="240" height="50">
  <defs>
    <linearGradient id="shieldGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e4ed8" />
    </linearGradient>
    <linearGradient id="wifiGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Left Icon Container -->
  <g transform="translate(4, 4)">
    <!-- Shield / Outer Contour -->
    <path d="M5 10 C5 7 19 3 21 3 C23 3 37 7 37 10 C37 25 25 36 21 39 C17 36 5 25 5 10 Z" fill="none" stroke="url(#shieldGradLight)" stroke-width="3" stroke-linejoin="round" />
    
    <!-- Stylized Letter 'P' -->
    <path d="M12 11 V33 H17 V24 H25 C29.5 24 32.5 21 32.5 17.5 C32.5 14 29.5 11 25 11 Z M17 15 H24 C26.5 15 27.5 16 27.5 17.5 C27.5 19 26.5 20 24 20 H17 Z" fill="#0284c7" />
    
    <!-- Car Silhouette inside P loop -->
    <path d="M20 18.5 L21 16.5 H24 L25 18.5 H26 C26.5 18.5 26.5 19 26 19.5 L25.5 20 H19.5 L19 19.5 C18.5 19 18.5 18.5 19 18.5 Z" fill="#ffffff" />
    <circle cx="20.5" cy="19.8" r="0.7" fill="#0f172a" />
    <circle cx="24.5" cy="19.8" r="0.7" fill="#0f172a" />

    <!-- WiFi / Smart IoT Signal Pulses -->
    <path d="M30 6 C33.5 8 36 11 37.5 14" fill="none" stroke="url(#wifiGradLight)" stroke-width="2.2" stroke-linecap="round" />
    <path d="M34 2 C39 4.5 42.5 8.5 44 13" fill="none" stroke="url(#wifiGradLight)" stroke-width="2.2" stroke-linecap="round" opacity="0.85" />
  </g>

  <!-- Typography: SmartPark -->
  <text x="56" y="29" font-family="'Inter', -apple-system, system-ui, sans-serif" font-size="22" font-weight="800" fill="#0f172a" letter-spacing="-0.5">
    Smart<tspan fill="#2563eb">Park</tspan>
  </text>

  <!-- PRO Badge -->
  <rect x="168" y="15" width="34" height="17" rx="4" fill="#2563eb" fill-opacity="0.1" stroke="#2563eb" stroke-width="1.2" />
  <text x="185" y="27" font-family="'Inter', -apple-system, sans-serif" font-size="9.5" font-weight="800" fill="#2563eb" text-anchor="middle" letter-spacing="0.5">PRO</text>

  <!-- Subtitle -->
  <text x="57" y="41" font-family="'Inter', -apple-system, system-ui, sans-serif" font-size="8" font-weight="600" fill="#64748b" letter-spacing="1.5">PARKING MANAGEMENT</text>
</svg>
