  <path d="M76 15 C87.5 22.5 94.5 33.5 96 46" fill="none" stroke="url(#spGradCyan)" stroke-width="3.5" stroke-linecap="round" opacity="0.85" />

  <!-- Smart Connectivity Node / Pulse Dot -->
